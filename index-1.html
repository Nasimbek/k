<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karta raqamim</title>
<style>
:root{--bg:#eef2f7;--tx:#0f172a;--mut:#64748b;--b1:#3b82f6;--b2:#14b8a6;--b3:#94a3b8;--glass:rgba(255,255,255,.7);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060b16;--tx:#e8eefc;--mut:#8a99b8;--b1:#1d4ed8;--b2:#0d9488;--b3:#334155;--glass:rgba(255,255,255,.06)}}
:root[data-theme="dark"]{--bg:#060b16;--tx:#e8eefc;--mut:#8a99b8;--b1:#1d4ed8;--b2:#0d9488;--b3:#334155;--glass:rgba(255,255,255,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:28px 18px;position:relative}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.35;z-index:0;animation:fl 14s ease-in-out infinite alternate}
.b1{width:320px;height:320px;background:var(--b1);top:-80px;left:-90px}
.b2{width:300px;height:300px;background:var(--b2);bottom:-60px;right:-90px;animation-delay:-5s}
.b3{width:240px;height:240px;background:var(--b3);top:45%;left:55%;animation-delay:-9s}
@keyframes fl{to{transform:translate(50px,-40px) scale(1.2)}}
.wrap{position:relative;z-index:1;width:100%;max-width:400px;display:flex;flex-direction:column;gap:24px;align-items:center;text-align:center}
.tag{font-size:12px;letter-spacing:.25em;text-transform:uppercase;color:var(--mut)}
h1{margin:6px 0 0;font-size:30px;line-height:1.15;background:linear-gradient(90deg,var(--tx) 40%,var(--b1));-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes sh{to{background-position:300% 0}}
.scene{width:100%;perspective:900px;animation:enter 1.1s cubic-bezier(.2,.9,.2,1) both,bob 5s ease-in-out 1.1s infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.card{position:relative;width:100%;aspect-ratio:1.586;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:24px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;padding:22px;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 25px 60px rgba(15,40,100,.4)}
.front{background:linear-gradient(135deg,#0a1731,#12306b 55%,#0f5a73)}
.back{transform:rotateY(180deg);background:linear-gradient(135deg,#0a1224,#16294a);padding:0;justify-content:flex-start}
.shine{position:absolute;inset:0;background:radial-gradient(circle at var(--mx,30%) var(--my,20%),rgba(255,255,255,.45),transparent 45%);mix-blend-mode:overlay;pointer-events:none}

.top{display:flex;justify-content:space-between;align-items:center;position:relative}

.chip:after{content:"";position:absolute;inset:6px 12px;border:1px solid rgba(0,0,0,.25);border-radius:4px}
.brand{font-weight:800;letter-spacing:.08em;font-size:15px}

.row{display:flex;justify-content:space-between;align-items:flex-end;position:relative}
.row small{display:block;opacity:.7;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.row b{font-size:15px;letter-spacing:.05em}
.strip{height:44px;background:#000;margin-top:26px}
.bk{padding:18px 22px;font-size:14px;line-height:1.5}
.hint{font-size:12px;color:var(--mut)}
.btn{position:relative;width:100%;border:0;border-radius:18px;padding:17px;font-size:17px;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(135deg,#1e40af,#0f766e);box-shadow:0 12px 30px rgba(30,64,175,.35);transition:transform .12s}
.btn:active{transform:scale(.97)}
.note{width:100%;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:14px 16px;font-size:14px;color:var(--mut)}
.p{position:fixed;z-index:5;pointer-events:none;font-size:22px;animation:pop 1.1s ease-out forwards}
@keyframes pop{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}

@keyframes enter{from{opacity:0;transform:translateY(-70px) rotateX(40deg) scale(.88)}}
@keyframes up{from{opacity:0;transform:translateY(26px)}}
.wrap>div:first-child{animation:up .8s .1s both}
.hint{animation:up .8s .9s both}
.btn{animation:up .8s 1.1s both,pulse 2.6s 2s infinite}
@keyframes pulse{0%{box-shadow:0 12px 30px rgba(30,64,175,.35),0 0 0 0 rgba(59,130,246,.5)}70%{box-shadow:0 12px 30px rgba(30,64,175,.35),0 0 0 18px rgba(59,130,246,0)}100%{box-shadow:0 12px 30px rgba(30,64,175,.35),0 0 0 0 rgba(59,130,246,0)}}
.front:after{content:"";position:absolute;top:-50%;bottom:-50%;width:35%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.3),transparent);transform:rotate(12deg);animation:sweep 4.5s ease-in-out 1.6s infinite;pointer-events:none}
@keyframes sweep{0%{left:-60%}45%,100%{left:140%}}
.pt{position:fixed;bottom:-12px;width:var(--s);height:var(--s);border-radius:50%;background:var(--b1);opacity:0;z-index:0;pointer-events:none;animation:rise var(--d) linear var(--dl) infinite}
@keyframes rise{10%{opacity:.45}100%{transform:translate(var(--x),-110vh);opacity:0}}

@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}
.ring{position:absolute;inset:0;border-radius:24px;padding:2px;pointer-events:none;background:conic-gradient(from var(--ang),transparent 62%,rgba(147,197,253,.95),rgba(94,234,212,.9),transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:rot 4.5s linear infinite}
@keyframes rot{to{--ang:360deg}}
.chip{animation:cg 2.4s ease-in-out infinite}
@keyframes cg{50%{box-shadow:0 0 16px rgba(241,226,176,.85)}}
.d{display:inline-block;animation:wv 4.5s ease-in-out infinite;animation-delay:calc(var(--i)*70ms + 1.2s)}
@keyframes wv{0%,20%,100%{transform:translateY(0)}10%{transform:translateY(-6px)}}
.bk{display:flex;gap:14px;align-items:center}
.cc2{stroke-dasharray:145;stroke-dashoffset:145}.ck{stroke-dasharray:50;stroke-dashoffset:50}
.card.flip .cc2{animation:dr .7s .45s forwards}.card.flip .ck{animation:dr .45s 1s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.btn{position:relative;overflow:hidden}
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rpl .7s ease-out forwards;pointer-events:none}
@keyframes rpl{to{transform:scale(3);opacity:0}}

.num{width:100%}
.num svg{display:block;width:100%;height:auto;overflow:visible}
.pen{transition:opacity .5s;filter:drop-shadow(0 5px 4px rgba(0,0,0,.45))}
</style>
</head>

<div class="wrap">

    <div class="face front">
      <div class="shine"></div><div class="holo"></div><div class="ring"></div>

      <div class="num" id="num">5614 6818 1298 3066</div>
      <div class="row"><div><small>Karta egasi</small><b>NABIYEV NASIMBEK</b></div><div style="font-size:26px">✦</div></div>
    </div>
    <div class="face back">
      <div class="strip"></div>
      <div class="bk"><svg viewBox="0 0 52 52" width="48" height="48"><circle class="cc2" cx="26" cy="26" r="23" fill="none" stroke="#5eead4" stroke-width="3"/><path class="ck" d="M15 27l8 8 15-17" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><div>Rahmat! 🙌<br>O'tkazma qilgach, chekni yuborishni unutmang.</div></div>
    </div>
  </div></div>

</div>
<script>
var card=document.getElementById('card'),btn=document.getElementById('copy'),num=document.getElementById('num');
card.addEventListener('click',function(){card.classList.toggle('flip')});
function tilt(e){
  if(card.classList.contains('flip'))return;
  var r=card.getBoundingClientRect(),p=e.touches?e.touches[0]:e,x=(p.clientX-r.left)/r.width,y=(p.clientY-r.top)/r.height;
  card.style.transform='rotateY('+((x-.5)*24)+'deg) rotateX('+((.5-y)*24)+'deg)';
  card.style.setProperty('--mx',x*100+'%');card.style.setProperty('--my',y*100+'%');
  card.querySelector('.shine').style.setProperty('--mx',x*100+'%');card.querySelector('.shine').style.setProperty('--my',y*100+'%');
}
function rst(){if(!card.classList.contains('flip'))card.style.transform=''}
card.addEventListener('mousemove',tilt);card.addEventListener('touchmove',tilt,{passive:true});
card.addEventListener('mouseleave',rst);card.addEventListener('touchend',rst);
card.addEventListener('transitionend',function(){if(card.classList.contains('flip'))card.style.transform=''});
function burst(){
  var r=btn.getBoundingClientRect(),em=['💙','✦','✓','💳','⭐'];
  for(var i=0;i<16;i++){
    var s=document.createElement('span');s.className='p';s.textContent=em[i%em.length];
    s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';
    s.style.setProperty('--dx',(Math.random()*240-120)+'px');s.style.setProperty('--dy',(-Math.random()*180-30)+'px');s.style.setProperty('--r',(Math.random()*360-180)+'deg');
    document.body.appendChild(s);setTimeout(function(n){return function(){n.remove()}}(s),1200);
  }
}
btn.addEventListener('click',function(){
  var t=real.replace(/\s/g,'');
  function ok(){btn.textContent='✓ Nusxalandi';splash()}
  function fb(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(a);ok()}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,fb)}else{fb()}
});


var DG={
'0':'M20 6C8 6 6 22 6 32C6 46 12 56 20 56C30 56 34 42 34 30C34 16 30 6 20 6',
'1':'M9 17L22 6L22 56',
'2':'M7 18C8 8 16 5 22 6C32 8 33 20 26 30C20 38 10 46 6 56L34 56',
'3':'M8 10C14 4 28 4 31 14C33 24 22 28 16 28C26 28 35 34 32 46C29 58 12 58 6 48',
'4':'M28 56L28 6L5 40L36 40',
'5':'M31 6L11 6L8 28C16 22 30 24 32 38C34 54 16 60 6 50',
'6':'M30 8C20 4 8 14 7 36C6 54 14 58 22 57C32 56 34 40 26 33C18 27 8 33 7 42',
'7':'M5 8L34 8C28 24 22 40 18 56',
'8':'M20 30C8 28 8 8 20 6C32 6 32 26 20 30C6 34 6 56 20 56C34 56 34 34 20 30',
'9':'M31 22C30 8 14 4 9 16C5 28 18 36 29 28C32 26 32 24 31 22C33 38 28 52 12 58'
};
var NS='http://www.w3.org/2000/svg',ink={items:[],svg:null},wid=0;
function mk(t,a){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);return e}
function buildInk(){
  var ch=real.split(''),x=0,svg=mk('svg',{}),g=mk('g',{}),gap=false;
  ink.items=[];ink.svg=svg;
  var defs=mk('defs',{}),fl=mk('filter',{id:'glow',filterUnits:'userSpaceOnUse',x:'-12',y:'-12',width:'64',height:'84'});
  fl.appendChild(mk('feGaussianBlur',{stdDeviation:'2.4',result:'b'}));
  var mg=mk('feMerge',{});mg.appendChild(mk('feMergeNode',{in:'b'}));mg.appendChild(mk('feMergeNode',{in:'SourceGraphic'}));
  fl.appendChild(mg);defs.appendChild(fl);svg.appendChild(defs);
  for(var i=0;i<ch.length;i++){
    var c=ch[i];
    if(c===' '){x+=22;gap=true;continue}
    if(!DG[c])continue;
    var gg=mk('g',{transform:'translate('+x+' '+(Math.random()*4-2).toFixed(1)+') rotate('+(Math.random()*8-4).toFixed(1)+' 20 30)'});
    var st='fill:none;stroke-linecap:round;stroke-linejoin:round;';
    var p=mk('path',{d:DG[c],style:st+'stroke:#fff;stroke-width:3.4'});
    var w=mk('path',{d:DG[c],style:st+'stroke:#ff6a1a;stroke-width:4.8;display:none'});
    var h=mk('path',{d:DG[c],style:st+'stroke:#ffe08a;stroke-width:4.2;display:none'});
    gg.appendChild(p);gg.appendChild(w);gg.appendChild(h);g.appendChild(gg);
    ink.items.push({el:p,warm:w,hot:h,gap:gap});gap=false;x+=36;
  }
  svg.setAttribute('viewBox','-6 -6 '+(x+10)+' 72');
  svg.appendChild(g);
  num.textContent='';num.appendChild(svg);
  ink.items.forEach(function(it){
    it.L=it.el.getTotalLength();
    [it.el,it.warm,it.hot].forEach(function(e){e.style.strokeDasharray=it.L+' '+(it.L+2);e.style.strokeDashoffset=it.L});
    it.el.style.opacity=0;
  });
}
function ptOf(it,l){var q=it.el.getPointAtLength(l),m=it.el.getCTM();return [m.a*q.x+m.c*q.y+m.e,m.b*q.x+m.d*q.y+m.f]}
function toScreen(pt){var r=ink.svg.getBoundingClientRect();return [r.left+pt[0],r.top+pt[1]]}

/* ---- olov ---- */
var FC=null,F2=null,FD=1,FS={x:0,y:0,px:null,py:null,vx:0,on:false},finten=0,FP=[],SM=[],SK=[],frun=false,flast=0,SP=[],SMS=null,SPN=24;
(function(){

  for(var i=0;i<SPN;i++){
    var c=document.createElement('canvas');c.width=c.height=64;var g=c.getContext('2d'),cl=col(i/(SPN-1)).join(','),gr=g.createRadialGradient(32,32,0,32,32,32);
    gr.addColorStop(0,'rgba('+cl+',1)');gr.addColorStop(.35,'rgba('+cl+',.5)');gr.addColorStop(1,'rgba('+cl+',0)');
    g.fillStyle=gr;g.fillRect(0,0,64,64);SP.push(c);
  }
  SMS=document.createElement('canvas');SMS.width=SMS.height=64;
  var g2=SMS.getContext('2d'),gr2=g2.createRadialGradient(32,32,0,32,32,32);

})();
function ensureFire(){
  if(FC)return;
  FC=document.createElement('canvas');FC.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:9';
  document.body.appendChild(FC);F2=FC.getContext('2d');FD=Math.min(window.devicePixelRatio||1,2);fsz();addEventListener('resize',fsz);
}
function fsz(){FC.width=innerWidth*FD;FC.height=innerHeight*FD}
function startFireLoop(){if(frun)return;frun=true;flast=performance.now();requestAnimationFrame(fireLoop)}
function fireLoop(now){
  var dt=Math.min(2.5,(now-flast)/16.67);flast=now;
  var c=F2,W=innerWidth,H=innerHeight,R=Math.random;
  c.setTransform(FD,0,0,FD,0,0);c.clearRect(0,0,W,H);
  finten+=((FS.on?1:0)-finten)*Math.min(1,.07*dt);
  if(FS.px===null){FS.px=FS.x;FS.py=FS.y}
  if(FS.on){var ox=FS.px;FS.px+=(FS.x-FS.px)*Math.min(1,.4*dt);FS.py+=(FS.y-FS.py)*Math.min(1,.4*dt);FS.vx=FS.px-ox}else FS.vx=0;
  var px=FS.px,py=FS.py,lean=-FS.vx*.3,i,p,n;
  n=Math.floor(finten*(4+R()*3));
  for(i=0;i<n;i++)FP.push({x:px+(R()-.5)*7,y:py+(R()-.5)*4,vx:(R()-.5)*.9+lean,vy:-(.9+R()*1.6),life:1,dec:.014+R()*.016,s:16+R()*14,ph:R()*6.28});
  if(finten>.3&&R()<.35)SM.push({x:px+(R()-.5)*8,y:py-18,vx:(R()-.5)*.3,vy:-.5-R()*.4,life:1,dec:.006+R()*.005,s:14});
  if(R()<.5*finten)SK.push({x:px,y:py-4,vx:(R()-.5)*3,vy:-(1+R()*3.5),life:1,dec:.015+R()*.02});

  if(finten>.02){var gs=120+R()*20;c.globalAlpha=.2*finten;c.drawImage(SP[6],px-gs/2,py-gs/2-10,gs,gs)}
  FP=FP.filter(function(q){return q.life>0});
  FP.forEach(function(q){
    q.vx+=Math.sin(now*.006+q.ph+q.y*.04)*.05*dt;q.vy-=.018*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=q.dec*dt;

function startWrite(){
  var id=++wid,items=ink.items,st=performance.now()+(id===1?1100:250);
  items.forEach(function(it){
    it.el.style.opacity=0;it.el.style.strokeDashoffset=it.L;it.warm.style.display='none';it.hot.style.display='none';
    it.d=it.L/0.8;if(it.gap)st+=60;it.t0=st;st+=it.d+25;
  });
  ensureFire();FS.on=false;FS.px=null;startFireLoop();
  var last=items[items.length-1],endAll=last.t0+last.d,holdUntil=0;ink.endAll=endAll;
  (function f(now){
    if(id!==wid)return;
    var u=-1,i,it,p,e,age;
    for(i=0;i<items.length;i++){
      it=items[i];p=(now-it.t0)/it.d;
      if(p<1&&u<0)u=i;

      if(p>=1){
        age=now-(it.t0+it.d);
        it.el.style.opacity=1;it.el.style.strokeDashoffset=0;
        var wo=Math.max(0,1-age/1100),ho=Math.max(0,1-age/350);

        continue;
      }

    }

      it=items[u];p=(now-it.t0)/it.d;
      e=p<=0?0:(p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2);
      var sp=toScreen(ptOf(it,it.L*e));FS.x=sp[0];FS.y=sp[1];FS.on=true;startFireLoop();
    }else if(u<0){
      if(!holdUntil)holdUntil=now+550;
      if(now<holdUntil){var le=items[items.length-1],ep=toScreen(ptOf(le,le.L));FS.x=ep[0];FS.y=ep[1];FS.on=true;startFireLoop()}else FS.on=false;
    }else FS.on=false;
    if(now<endAll+1600||(holdUntil&&now<holdUntil+100))requestAnimationFrame(f);else FS.on=false;
  })(performance.now());
}

/* ---- suv ---- */
var WC=null,W2=null,WD=1,WP=[],wrun=false,wlast=0,wtm=null;
function ensureWater(){
  if(WC)return;
  WC=document.createElement('canvas');WC.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:10';
  document.body.appendChild(WC);W2=WC.getContext('2d');WD=Math.min(window.devicePixelRatio||1,2);wsz();addEventListener('resize',wsz);
}
function wsz(){WC.width=innerWidth*WD;WC.height=innerHeight*WD}
function extinguish(){
  var was=FS.on||finten>.1;
  if(performance.now()<(ink.endAll||0)+1200){
    wid++;
    ink.items.forEach(function(it){it.el.style.opacity=1;it.el.style.strokeDashoffset=0;it.warm.style.display='none';it.hot.style.display='none'});
  }
  FS.on=false;
  return was;
}
function steam(x,y,n,big){
  for(var i=0;i<n;i++)SM.push({x:x+(Math.random()-.5)*(big?40:14),y:y-8,vx:(Math.random()-.5)*.8,vy:-.7-Math.random()*.9,life:1,dec:.007+Math.random()*.006,s:(big?22:16)+Math.random()*14});
  startFireLoop();
}
function splash(){
  ensureWater();
  var R=Math.random,was=extinguish(),now=performance.now();
  var br=btn.getBoundingClientRect(),bx=br.left+br.width/2,by=br.top+br.height/2,cr=card.getBoundingClientRect(),i;
  if(was&&FS.px!==null)steam(FS.px,FS.py,24,true);
  for(i=0;i<100;i++){var a=-Math.PI/2+(R()-.5)*2.7,v=6+R()*10;
    WP.push({x:bx+(R()-.5)*70,y:by,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.38,s:1.6+R()*2.6,life:1,dec:.006+R()*.006,k:0,t0:now})}
  for(i=0;i<90;i++){
    WP.push({x:cr.left+R()*cr.width,y:cr.top-40-R()*120,vx:(R()-.5)*.7,vy:3+R()*4,g:.3,s:1.4+R()*2.4,life:1,dec:0,ty:cr.top+cr.height*(.25+R()*.55),k:1,t0:now+R()*650,was:was});
  }
  var nel=num.firstChild;
  ink.items.forEach(function(it){it.el.style.stroke='#bfe6ff'});
  if(nel)nel.style.filter='drop-shadow(0 0 9px rgba(96,200,255,.95))';
  clearTimeout(wtm);
  wtm=setTimeout(function(){ink.items.forEach(function(it){it.el.style.stroke='#fff'});if(nel)nel.style.filter=''},1700);
  if(!wrun){wrun=true;wlast=now;requestAnimationFrame(waterLoop)}
}
function waterLoop(now){
  var dt=Math.min(2.5,(now-wlast)/16.67);wlast=now;
  var c=W2,H=innerHeight,R=Math.random,add=[];
  c.setTransform(WD,0,0,WD,0,0);c.clearRect(0,0,innerWidth,H);
  c.lineCap='round';
  WP=WP.filter(function(q){
    if(now<q.t0)return true;
    q.vy+=q.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;
    if(q.k===1&&q.y>=q.ty){
      for(var j=0;j<5;j++)add.push({x:q.x,y:q.y,vx:(R()-.5)*5,vy:-(1+R()*3.2),g:.32,s:.9+R()*1.1,life:1,dec:.04+R()*.02,k:2,t0:0});
      if(q.was&&R()<.18)steam(q.x,q.y,1,false);
      return false;
    }
    if(q.k!==1){q.life-=q.dec*dt;if(q.life<=0||q.y>H+60)return false}
    var al=Math.min(1,q.life*2);
    c.strokeStyle='rgba(120,200,255,'+(.85*al)+')';c.lineWidth=q.s*1.5;
    c.beginPath();c.moveTo(q.x,q.y);c.lineTo(q.x-q.vx*1.6,q.y-q.vy*1.6);c.stroke();
    c.fillStyle='rgba(235,248,255,'+(.9*al)+')';c.beginPath();c.arc(q.x-q.vx*.2,q.y-q.vy*.2,q.s*.55,0,6.283);c.fill();
    return true;
  });
  if(add.length)WP=WP.concat(add);
  if(!WP.length){wrun=false;c.clearRect(0,0,innerWidth,H);return}
  requestAnimationFrame(waterLoop);
}
card.addEventListener('click',function(){setTimeout(function(){if(!card.classList.contains('flip'))startWrite()},800)});
var real=num.textContent;try{buildInk()}catch(e){}
(function(){
  for(var i=0;i<14;i++){var p=document.createElement('i');p.className='pt';
    p.style.cssText='left:'+Math.random()*100+'%;--s:'+(3+Math.random()*6)+'px;--d:'+(9+Math.random()*10)+'s;--dl:-'+Math.random()*12+'s;--x:'+(Math.random()*80-40)+'px';
    document.body.appendChild(p)}
  if(false)return;
  setTimeout(startWrite,0);
})();

var RM=false,cv=document.getElementById('fx'),cx=cv.getContext('2d'),P=[],run=false,DPR=Math.min(window.devicePixelRatio||1,2);
function rs(){cv.width=innerWidth*DPR;cv.height=innerHeight*DPR}rs();addEventListener('resize',rs);
var COL=['#3b82f6','#14b8a6','#fbbf24','#ffffff','#7dd3fc','#6366f1'];
function setReal(){num.innerHTML=real.split('').map(function(c,i){return '<span class="d" style="--i:'+i+'">'+(c===' '?'&nbsp;':c)+'</span>'}).join('')}
function loop(){
  if(run)return;run=true;
  (function f(){
    cx.setTransform(DPR,0,0,DPR,0,0);cx.clearRect(0,0,innerWidth,innerHeight);
    P=P.filter(function(p){return p.life>0});
    P.forEach(function(p){
      p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.life-=p.dec;p.r+=p.vr||0;
      cx.globalAlpha=Math.max(p.life,0)*(p.tr?.6:1);cx.fillStyle=p.c;
      if(p.tr){cx.beginPath();cx.arc(p.x,p.y,Math.max(0.01,p.s*Math.max(p.life,0)),0,6.283);cx.fill()}
      else if(p.coin){cx.save();cx.translate(p.x,p.y);cx.scale(Math.abs(Math.cos(p.r)),1);cx.beginPath();cx.arc(0,0,p.s,0,6.283);cx.fill();cx.restore()}
      else{cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);cx.restore()}
    });
    if(P.length)requestAnimationFrame(f);else{run=false;cx.clearRect(0,0,innerWidth,innerHeight)}
  })();
}
function fire(){
  if(RM)return;
  var r=btn.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
  for(var i=0;i<80;i++){
    var a=Math.random()*6.283,v=3+Math.random()*10,c=Math.random()<.3;
    P.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-6,g:.3,life:1,dec:.007+Math.random()*.01,s:c?5+Math.random()*4:5+Math.random()*7,c:c?'#fbbf24':COL[i%COL.length],coin:c,r:Math.random()*6,vr:.12+Math.random()*.2});
  }
  loop();
}
var lx=0,ly=0;
addEventListener('pointermove',function(e){
  if(RM)return;
  if(Math.abs(e.clientX-lx)+Math.abs(e.clientY-ly)<10)return;
  lx=e.clientX;ly=e.clientY;
  P.push({x:lx,y:ly,vx:(Math.random()-.5)*.8,vy:(Math.random()-.5)*.8,g:0,life:1,dec:.035,s:5+Math.random()*5,c:Math.random()<.5?'#60a5fa':'#2dd4bf',tr:1});
  loop();
});
btn.addEventListener('click',function(e){
  var r=btn.getBoundingClientRect(),d=Math.max(r.width,r.height),m=document.createElement('span');
  m.className='rp';m.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(e.clientX-r.left-d/2)+'px;top:'+(e.clientY-r.top-d/2)+'px';
  btn.appendChild(m);setTimeout(function(){m.remove()},700);
});
</script>
